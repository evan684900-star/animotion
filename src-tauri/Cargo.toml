[package]
name = "animotion"
version = "0.1.0"
description = "Logiciel d'animation dessin vectoriel & pixel art"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
discord-rich-presence = "1.1"

# Optimisé pour un .exe le plus léger possible
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
