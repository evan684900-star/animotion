name: Build Windows (.exe)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler Animotion
        run: npx tauri build

      - name: Rassembler les .exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-exe | Out-Null
          Copy-Item src-tauri/target/release/animotion.exe dist-exe/Animotion.exe
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName dist-exe/Animotion-installateur.exe
          Get-ChildItem dist-exe | Format-Table Name, Length

      # Une seule release « latest » remplacée à chaque push : le lien de téléchargement ne change jamais.
      - name: Supprimer l'ancienne release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes

      - name: Publier la dernière version
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create latest dist-exe/Animotion.exe dist-exe/Animotion-installateur.exe
          --target ${{ github.sha }}
          --title "Animotion (dernière version)"
          --notes "Animotion.exe : se lance directement, sans installation. Animotion-installateur.exe : installe l'appli avec un raccourci. Compilé depuis le commit ${{ github.sha }}."
          --latest
