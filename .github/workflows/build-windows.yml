name: Build Windows (.exe)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # l'historique complet sert à écrire les notes de version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances
        run: npm ci

      # Numéro de version qui augmente à chaque compilation : c'est lui que l'appli compare pour se mettre à jour
      - name: Numéroter la version
        shell: bash
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node -e "const f='src-tauri/tauri.conf.json';const c=JSON.parse(require('fs').readFileSync(f));c.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Compiler Animotion
        run: npx tauri build

      - name: Rassembler les .exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-exe | Out-Null
          Copy-Item src-tauri/target/release/animotion.exe dist-exe/Animotion.exe
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName dist-exe/Animotion-installateur.exe
          Get-ChildItem dist-exe | Format-Table Name, Length

      # Notes de version = les commits depuis la release précédente (affichées dans l'appli après la mise à jour)
      - name: Écrire les notes de version
        shell: bash
        run: |
          PREV=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="-n 5 HEAD"; fi
          git log $RANGE --no-merges --format='### %s%n%b' \
            | grep -v -E '^(Co-Authored-By|Claude-Session):' | cat -s > notes.md
          [ -s notes.md ] || echo "Petites améliorations et corrections." > notes.md
          cat notes.md

      # Les noms des fichiers ne changent jamais : les liens .../releases/latest/download/Animotion.exe restent valides
      - name: Publier la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub répond parfois « 504 » : on réessaie, et on complète une release créée à moitié
        run: |
          TAG="v$VERSION"
          for i in 1 2 3 4; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist-exe/Animotion.exe dist-exe/Animotion-installateur.exe --clobber \
                && gh release edit "$TAG" --latest --notes-file notes.md && exit 0
            else
              gh release create "$TAG" dist-exe/Animotion.exe dist-exe/Animotion-installateur.exe \
                --target "${{ github.sha }}" --title "Animotion $VERSION" --notes-file notes.md --latest && exit 0
            fi
            echo "Échec de la tentative $i, nouvel essai dans $((i * 20)) s…"
            sleep $((i * 20))
          done
          exit 1

      # On ne garde que les 3 dernières releases pour que la liste reste simple
      - name: Nettoyer les anciennes releases
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
