<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Animotion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="ribbon">
      <div id="tabs">
        <div class="brand"><span class="brand-logo"></span>ANIMOTION</div>
        <nav id="tabbar"></nav>
        <div id="modeBadge"></div>
      </div>
      <div id="ribbonBody"></div>
    </header>
    <div id="main">
      <aside id="toolbar"></aside>
      <section id="stage">
        <div id="rulerCorner"></div>
        <canvas id="rulerTop"></canvas>
        <canvas id="rulerLeft"></canvas>
        <div id="viewportWrap"><canvas id="viewport"></canvas></div>
      </section>
      <aside id="sidepanel"></aside>
    </div>
    <section id="timeline"></section>
    <footer id="statusbar"></footer>
  </div>
  <div id="startScreen"></div>
  <div id="modalRoot"></div>
  <div id="toasts"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
